name: Daily SPC Tenders Synchronization

on:
  schedule:
    # Runs daily at 06:00 UTC (11:30 AM Sri Lanka Time)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync Online Tenders & Publish Releases
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token (Optional)
        id: app-token
        uses: actions/create-github-app-token@v1
        continue-on-error: true
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Resolve GitHub Authentication Token
        id: auth
        run: |
          if [ -n "${{ steps.app-token.outputs.token }}" ]; then
            echo "token=${{ steps.app-token.outputs.token }}" >> $GITHUB_OUTPUT
            echo "Authenticated using GitHub App (APP_ID configured)."
          else
            echo "token=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_OUTPUT
            echo "Using default GITHUB_TOKEN (GitHub App secrets not configured)."
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.auth.outputs.token }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SPC Tender Synchronization
        id: sync
        env:
          PYTHONUNBUFFERED: "1"
        run: python run_sync.py

      - name: Commit & push updated data
        if: steps.sync.outputs.has_new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): auto-update tender manifest & catalog (+${{ steps.sync.outputs.new_count }} tenders) [skip ci]"
          git push origin main

      - name: Create GitHub Release
        if: steps.sync.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          gh release create "${{ steps.sync.outputs.tag_name }}" \
            "${{ steps.sync.outputs.zip_path }}" \
            "${{ steps.sync.outputs.consolidated_xlsx }}" \
            "${{ steps.sync.outputs.extracted_csv }}" \
            --title "${{ steps.sync.outputs.release_title }}" \
            --notes-file "${{ steps.sync.outputs.release_notes_file }}"
